# Exact setting used for the E-question 2/3 run.
feature_file: E题/E题数据/附件2-数据集特征文件/aligned_50.pkl
text_encoder:
  id: google-bert/bert-base-uncased
  revision: 86b5e0934494bd15c9632b12f734a8a67f723594
  component: frozen_word_embeddings
model:
  hidden: 96
  temporal_layers: 2
  attention_heads: 4
  dropout: 0.2
training:
  seed: 2026
  epochs: 35
  batch_size: 128
  optimizer: AdamW
  learning_rate: 0.0005
  weight_decay: 0.01
  cosine_min_learning_rate: 0.00003
  loss:
    classification: 1.0
    huber_regression: 0.5
    unimodal_auxiliary: 0.1
  masking:
    unchanged_sample_probability: 0.2
    span_fraction_min: 0.1
    span_fraction_max: 0.6
    masked_modality_counts: [1, 1, 1, 2, 2, 3]
  model_selection: macro_f1_minus_0.08_mae
evaluation:
  missing_fractions: [0.1, 0.3, 0.5]
  missing_locations: [start, middle, end]
  simultaneous_missing_modes: [text_audio, text_vision, audio_vision, all_three]
explanation:
  coalition_count: 8
  local_window_positions: 3
  windows_per_modality: 3
